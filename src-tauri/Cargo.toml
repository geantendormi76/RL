[workspace]
resolver = "2"
members = [
    "crates/core-vram",
    "crates/core-bpe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Industrial AI Forge Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
parking_lot = "0.12"
